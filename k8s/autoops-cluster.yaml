---
apiVersion: v1
kind: Namespace
metadata:
  name: autoops
  labels:
    app.kubernetes.io/name: autoops
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoops-api
  namespace: autoops
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoops-worker
  namespace: autoops
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoops-frontend
  namespace: autoops
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: autoops-config
  namespace: autoops
data:
  AUTOOPS_ENV: production
  AUTOOPS_ALLOWED_ROOTS: /app
  AUTOOPS_BACKUP_DIR: /app/backups
  AUTOOPS_INBOX: /app/inbox
  REQUIRE_ENCRYPTION: "false"
  CHROMA_PERSIST_DIR: /app/.cache/chroma_data
  GMAIL_AUTH_BIND_ADDR: 0.0.0.0
  GMAIL_AUTH_HOST: localhost
  GMAIL_AUTH_PORTS: 8080,8081,8082,8083,8084
  JWT_ALGORITHM: HS256
  OLLAMA_BASE_URL: http://ollama:11434
  REDIS_URL: redis://redis:6379/0

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-cache
  namespace: autoops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autoops-files
  namespace: autoops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: autoops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: autoops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: autoops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: autoops
  labels:
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoops
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.2.5-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-tmp
              mountPath: /tmp
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
        - name: redis-tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: autoops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: autoops
  labels:
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoops
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:15.7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autoops-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: autoops
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "autoops"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "autoops"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: postgres-tmp
              mountPath: /tmp
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-run
          emptyDir: {}
        - name: postgres-tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: autoops
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics/prometheus
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: autoops
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoops
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: autoops-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/your-org/autoops-api:2026.07.05
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: autoops-config
          env:
            - name: AUTOOPS_REQUIRE_ENCRYPTED_SECRETS
              valueFrom:
                configMapKeyRef:
                  name: autoops-config
                  key: REQUIRE_ENCRYPTION
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: autoops-secrets
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: autoops-secrets
                  key: jwt-secret-key
            - name: AUTOOPS_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autoops-secrets
                  key: bootstrap-password
            - name: AUTOOPS_BACKUP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: autoops-secrets
                  key: backup-encryption-key
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: chroma-cache
              mountPath: /app/.cache
            - name: autoops-files
              mountPath: /app/backups
              subPath: backups
            - name: autoops-files
              mountPath: /app/inbox
              subPath: inbox
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: chroma-cache
          persistentVolumeClaim:
            claimName: chroma-cache
        - name: autoops-files
          persistentVolumeClaim:
            claimName: autoops-files
        - name: tmp
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: autoops
  labels:
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoops
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: autoops-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/your-org/autoops-worker:2026.07.05
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: autoops-config
          env:
            - name: AUTOOPS_REQUIRE_ENCRYPTED_SECRETS
              valueFrom:
                configMapKeyRef:
                  name: autoops-config
                  key: REQUIRE_ENCRYPTION
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: autoops-secrets
                  key: database-url
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["python", "-c", "import worker.tasks"]
            initialDelaySeconds: 15
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["python", "-c", "import worker.tasks"]
            initialDelaySeconds: 60
            periodSeconds: 60
          volumeMounts:
            - name: chroma-cache
              mountPath: /app/.cache
            - name: autoops-files
              mountPath: /app/backups
              subPath: backups
            - name: autoops-files
              mountPath: /app/inbox
              subPath: inbox
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: chroma-cache
          persistentVolumeClaim:
            claimName: chroma-cache
        - name: autoops-files
          persistentVolumeClaim:
            claimName: autoops-files
        - name: tmp
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: autoops
  labels:
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoops
        app.kubernetes.io/component: beat
    spec:
      serviceAccountName: autoops-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          image: ghcr.io/your-org/autoops-worker:2026.07.05
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "worker.tasks.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: autoops-config
          env:
            - name: AUTOOPS_REQUIRE_ENCRYPTED_SECRETS
              valueFrom:
                configMapKeyRef:
                  name: autoops-config
                  key: REQUIRE_ENCRYPTION
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: autoops-secrets
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["python", "-c", "import worker.tasks"]
            initialDelaySeconds: 15
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["python", "-c", "import worker.tasks"]
            initialDelaySeconds: 60
            periodSeconds: 60
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: autoops
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 5173

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: autoops
  labels:
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoops
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: autoops-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/your-org/autoops-frontend:2026.07.05
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: autoops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: autoops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: autoops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autoops-default-deny
  namespace: autoops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autoops-allow-required-traffic
  namespace: autoops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: beat
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: TCP
          port: 5173
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 11434
