version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      python-runtime:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Kolkata
    groups:
      frontend-runtime:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Kolkata
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Asia/Kolkata
    groups:
      backend-images:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - containers

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Kolkata
    groups:
      frontend-images:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - containers
